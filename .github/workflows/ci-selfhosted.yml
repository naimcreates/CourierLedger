# CourierLedger M1 — CI on the self-hosted runner (Milestone 12).
#
# Mirror of the canonical .github/workflows/ci.yml, adapted for the
# self-hosted runner `courierledger-vm` on the dev VM:
#   * NO service containers — Docker cannot start containers in this
#     VM (`runc create failed: setns: operation not permitted`).
#     All PostgreSQL work goes against the VM's local cluster
#     (PostgreSQL 16, port 5432, UTF8), which the provisioning steps
#     below (re)create from scratch: roles, courierledger_ci_app /
#     courierledger_ci_dev, Alembic, rls.sql / triggers.sql, roles.sql,
#     seed_couriers.sql. Only synthetic data lives in these DBs.
#   * The runner runs as root (RUNNER_ALLOW_RUNASROOT=1), so the
#     live-test `su postgres -c "psql ..."` calls in
#     backend/tests/live_pg.py work directly — no sudo shim needed.
#   * Jobs run sequentially: one self-hosted runner executes one job
#     at a time, and all jobs share the same local cluster/DBs.
#
# DO NOT treat this as the canonical CI: .github/workflows/ci.yml
# (runs-on: ubuntu-latest, postgres:16 service) stays authoritative
# for GitHub-hosted runners once the account billing lock is fixed.
#
# Secrets: the only secret is CI_POSTGRES_PASSWORD (repo secret — a
# fresh random value, rotated in Phase 1, 2026-11-01). There is NO
# literal fallback: the jobs fail closed when the secret is unset.
# Phase 1 (A-F3): self-hosted runs use DEDICATED CI-only databases
# (courierledger_ci_app / courierledger_ci_dev) and NEVER drop
# courierledger_ci_app / courierledger_ci_dev, and they do NOT reset the
# shared role passwords. The workflow authenticates with the secret,
# so for self-hosted runs the secret MUST equal the current password
# of the courierledger / courierledger_runtime roles (see
# PRODUCTION_SECRETS_GUIDE.md — the Phase 1 rotation set the secret
# and both local roles to the same fresh value). No other secret is
# needed: SECRET_KEY / SESSION_SECRET are generated fresh per run.
#
# PARKED 2026-11-01 (Milestone 12, CI-independent development): the
# runner `courierledger-vm` went offline (its process is gone) and its
# registration was removed; no self-hosted runner exists, so this
# workflow's jobs will queue until one is re-registered. Do NOT
# delete this file — it is the tested record of how CI runs on this
# VM. Re-registration: download the actions-runner release, get a
# registration token (POST /repos/naimcreates/CourierLedger/actions/
# runners/registration-token), `./config.sh --url
# https://github.com/naimcreates/CourierLedger --token <token>
# --labels self-hosted,linux --unattended`, then `./run.sh` with
# RUNNER_ALLOW_RUNASROOT=1. Known results so far: run 41288531890
# (backend + e2e provisioning failed — shell syntax error in the
# provisioning heredoc, fixed in 3e82c81), run 41290116524 (same
# syntax error — the fix had not landed yet), run 41292188799
# (frontend success; e2e FAILED — "Set up Node 24" never completed,
# 30-minute job timeout, Node download/cache-restore stalled through
# the egress proxy; backend job never started — runner went offline).
# The canonical .github/workflows/ci.yml stays authoritative for
# GitHub-hosted runners once the account billing lock is fixed.

name: CI (self-hosted)

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-selfhosted-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_PG_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5432"
  OWNER_ROLE: courierledger
  RUNTIME_ROLE: courierledger_runtime

jobs:
  # ------------------------------------------------------------------
  backend:
    name: Backend pytest (SQLite + live PostgreSQL)
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Require CI_POSTGRES_PASSWORD secret
        run: |
          if [ -z "${CI_PG_PASSWORD}" ]; then
            echo "::error::CI_POSTGRES_PASSWORD repo secret is not set; refusing to run with a placeholder password." >&2
            exit 1
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: m1/backend/requirements.txt

      - name: Install backend dependencies (venv, as local dev does)
        working-directory: m1/backend
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      # Provision courierledger_ci_app + courierledger_ci_dev from scratch
      # against the VM's local cluster: drop the (synthetic-only) DBs,
      # create roles, Alembic as the owner, rls/triggers as the owner,
      # roles.sql as the postgres superuser, runtime-role password,
      # then seed. Mirrors m1/README.md §3, except superuser psql runs
      # via `su postgres` against the local cluster instead of TCP
      # against a service container.
      - name: Provision PostgreSQL (roles, DBs, Alembic, RLS/triggers/roles, seed)
        working-directory: m1/backend
        env:
          PGPASSWORD: ${{ env.CI_PG_PASSWORD }}
          OWNER_URL: postgresql+psycopg://courierledger:${{ env.CI_PG_PASSWORD }}@localhost:5432/courierledger_ci_app
          RUNTIME_URL: postgresql+psycopg://courierledger_runtime:${{ env.CI_PG_PASSWORD }}@localhost:5432/courierledger_ci_app
        run: |
          set -euo pipefail
          cat > /tmp/ci_provision_roles.sql <<'EOSQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'courierledger') THEN
              CREATE ROLE courierledger LOGIN;
            END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'courierledger_runtime') THEN
              CREATE ROLE courierledger_runtime LOGIN;
            END IF;
          END
          $$;
          EOSQL
          # The postgres OS user must be able to read this file
          # (root's umask makes it 660 otherwise).
          chmod 644 /tmp/ci_provision_roles.sql
          su postgres -c "psql -d postgres -v ON_ERROR_STOP=1 -c \"SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname IN ('courierledger_ci_app', 'courierledger_ci_dev', 'courierledger_live_test');\""
          su postgres -c "psql -d postgres -v ON_ERROR_STOP=1 -c \"DROP DATABASE IF EXISTS courierledger_ci_app;\" -c \"DROP DATABASE IF EXISTS courierledger_ci_dev;\""
          su postgres -c "psql -d postgres -v ON_ERROR_STOP=1 -f /tmp/ci_provision_roles.sql"
          su postgres -c "psql -d postgres -v ON_ERROR_STOP=1 -c \"CREATE DATABASE courierledger_ci_app OWNER courierledger;\" -c \"CREATE DATABASE courierledger_ci_dev OWNER courierledger;\""
          # Alembic as the DB owner (MIGRATION_DATABASE_URL), both DBs.
          MIGRATION_DATABASE_URL="${OWNER_URL}" \
            .venv/bin/alembic upgrade head
          MIGRATION_DATABASE_URL="postgresql+psycopg://courierledger:${CI_PG_PASSWORD}@localhost:5432/courierledger_ci_dev" \
            .venv/bin/alembic upgrade head
          # RLS + triggers as the owner role, per database.
          for db in courierledger_ci_app courierledger_ci_dev; do
          PGPASSWORD="${CI_PG_PASSWORD}" psql -h localhost -U courierledger -d "$db" \
              -v ON_ERROR_STOP=1 -f app/db/rls.sql
          PGPASSWORD="${CI_PG_PASSWORD}" psql -h localhost -U courierledger -d "$db" \
              -v ON_ERROR_STOP=1 -f app/db/triggers.sql
          done
          # roles.sql as the superuser (it creates roles), per database.
          # Phase 1 (A-F3): roles.sql sets NO password and this workflow
          # does NOT reset the shared role passwords — it authenticates
          # with CI_POSTGRES_PASSWORD, which must equal the roles'
          # current password (see the header comment).
          cp app/db/roles.sql /tmp/ci_roles.sql && chmod 644 /tmp/ci_roles.sql
          for db in courierledger_ci_app courierledger_ci_dev; do
            su postgres -c "psql -d $db -v ON_ERROR_STOP=1 -f /tmp/ci_roles.sql"
          done
          # Seed the 5 courier codes (idempotent; no rates/templates).
          for db in courierledger_ci_app courierledger_ci_dev; do
          PGPASSWORD="${CI_PG_PASSWORD}" psql -h localhost -U courierledger -d "$db" \
              -v ON_ERROR_STOP=1 -f app/db/seed_couriers.sql
          done

      # Full suite without the live env: live-PostgreSQL modules skip
      # (they need CL_LIVE_PG_PASSWORD) and the SQLite suite runs.
      - name: Backend pytest (SQLite suite; live modules skip)
        working-directory: m1/backend
        run: .venv/bin/python -m pytest tests/ -q

      # Live suite. backend/tests/live_pg.py provisions its own
      # scratch DB (courierledger_live_test) and starts uvicorn, and
      # shells out to `su postgres -c "psql ..."` — which works here
      # because the runner runs as root on this VM. No shim needed.
      - name: Backend pytest (live PostgreSQL, runtime role)
        working-directory: m1/backend
        env:
          CL_LIVE_PG_PASSWORD: ${{ env.CI_PG_PASSWORD }}
          CL_LIVE_PG_ROLE: courierledger_runtime
          CL_LIVE_PG_HOST: 127.0.0.1
        run: .venv/bin/python -m pytest tests/ -q

  # ------------------------------------------------------------------
  frontend:
    name: Frontend build + Vitest
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: m1/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: m1/frontend
        run: npm ci

      - name: Frontend build
        working-directory: m1/frontend
        run: npm run build

      - name: Frontend Vitest
        working-directory: m1/frontend
        run: npm test

  # ------------------------------------------------------------------
  # Playwright e2e: full happy path register -> workspace -> import ->
  # run -> settle against the real backend + real PostgreSQL.
  # Provision courierledger_ci_app only — the e2e backend connects
  # to it as the runtime role (see the generated backend/.env).
  # The backend .env is generated here (CI-only, gitignored) because
  # frontend/playwright.config.ts reads m1/backend/.env and crashes
  # if it is missing.
  e2e:
    name: Playwright e2e (real backend + PostgreSQL)
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Require CI_POSTGRES_PASSWORD secret
        run: |
          if [ -z "${CI_PG_PASSWORD}" ]; then
            echo "::error::CI_POSTGRES_PASSWORD repo secret is not set; refusing to run with a placeholder password." >&2
            exit 1
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: m1/backend/requirements.txt

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: m1/frontend/package-lock.json

      - name: Install backend dependencies (venv, as local dev does)
        working-directory: m1/backend
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: m1/frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: m1/frontend
        run: npx playwright install --with-deps chromium

      - name: Provision PostgreSQL (courierledger_ci_app)
        working-directory: m1/backend
        env:
          PGPASSWORD: ${{ env.CI_PG_PASSWORD }}
          OWNER_URL: postgresql+psycopg://courierledger:${{ env.CI_PG_PASSWORD }}@localhost:5432/courierledger_ci_app
        run: |
          set -euo pipefail
          cat > /tmp/ci_provision_roles.sql <<'EOSQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'courierledger') THEN
              CREATE ROLE courierledger LOGIN;
            END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'courierledger_runtime') THEN
              CREATE ROLE courierledger_runtime LOGIN;
            END IF;
          END
          $$;
          EOSQL
          # The postgres OS user must be able to read this file
          # (root's umask makes it 660 otherwise).
          chmod 644 /tmp/ci_provision_roles.sql
          su postgres -c "psql -d postgres -v ON_ERROR_STOP=1 -c \"SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = 'courierledger_ci_app';\""
          su postgres -c "psql -d postgres -v ON_ERROR_STOP=1 -c \"DROP DATABASE IF EXISTS courierledger_ci_app;\""
          su postgres -c "psql -d postgres -v ON_ERROR_STOP=1 -f /tmp/ci_provision_roles.sql"
          su postgres -c "psql -d postgres -v ON_ERROR_STOP=1 -c \"CREATE DATABASE courierledger_ci_app OWNER courierledger;\""
          MIGRATION_DATABASE_URL="${OWNER_URL}" \
            .venv/bin/alembic upgrade head
          PGPASSWORD="${CI_PG_PASSWORD}" psql -h localhost -U courierledger \
            -d courierledger_ci_app -v ON_ERROR_STOP=1 -f app/db/rls.sql
          PGPASSWORD="${CI_PG_PASSWORD}" psql -h localhost -U courierledger \
            -d courierledger_ci_app -v ON_ERROR_STOP=1 -f app/db/triggers.sql
          cp app/db/roles.sql /tmp/ci_roles.sql && chmod 644 /tmp/ci_roles.sql
          su postgres -c "psql -d courierledger_ci_app -v ON_ERROR_STOP=1 -f /tmp/ci_roles.sql"
          PGPASSWORD="${CI_PG_PASSWORD}" psql -h localhost -U courierledger \
            -d courierledger_ci_app -v ON_ERROR_STOP=1 -f app/db/seed_couriers.sql

      - name: Write CI backend .env for Playwright
        working-directory: m1/backend
        env:
          CI_DATABASE_URL: postgresql+psycopg://courierledger_runtime:${{ env.CI_PG_PASSWORD }}@localhost:5432/courierledger_ci_app
        run: |
          set -euo pipefail
          SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
          SESSION_SECRET="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
          cat > .env <<EOF
          # Generated by GitHub Actions for the Playwright e2e job only.
          # CI-only values; never commit.
          DATABASE_URL=${CI_DATABASE_URL}
          SECRET_KEY=${SECRET_KEY}
          SESSION_SECRET=${SESSION_SECRET}
          FRONTEND_URL=http://127.0.0.1:5173
          ENVIRONMENT=development
          CREATE_TABLES_ON_STARTUP=false
          SESSION_COOKIE_SECURE=false
          EOF
          chmod 600 .env

      - name: Playwright e2e
        working-directory: m1/frontend
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            m1/frontend/playwright-report/
            m1/frontend/test-results/
          retention-days: 7
