# CourierLedger M1 — local development stack.
#
# PostgreSQL 16 + backend API. The database service starts first
# (`docker compose up -d db`); the backend container depends on it
# being healthy. Run the frontend from its own dev server
# (`npm run dev`) -- the containerised frontend is not wired yet
# (see the frontend service note below).
#
# No real secrets are in this file. Copy ../.env.example to .env at the
# m1/ root (or export the variables) and set real values. Phase 1
# (A-F7/C-8.2): no password or secret defaults to a placeholder here —
# compose fails closed when POSTGRES_PASSWORD / SECRET_KEY /
# SESSION_SECRET are unset. ENVIRONMENT is parameterised (default
# development); the DB port binds to loopback only. Docker cannot run
# in this VM, so this file is verified by YAML validation + inspection
# only, not by `docker compose up` (B-2 still open).
#
# DOCKER STATUS (Phase 2, Part 5 — 2026-11-01): containers cannot
# start in this VM (`runc create failed: setns: operation not
# permitted`) and the `docker` binary itself is currently absent
# (removed by a container replacement). Do NOT claim this stack is
# verified until `docker compose up` actually runs somewhere. The
# supported local fallback is native PostgreSQL — see
# m1/LOCAL_VERIFICATION.md for the provisioning order.

services:
  db:
    image: postgres:16
    container_name: courierledger-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-courierledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (no placeholder default)}
      POSTGRES_DB: ${POSTGRES_DB:-courierledger}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - courierledger_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-courierledger} -d ${POSTGRES_DB:-courierledger}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Backend API. The database must be PROVISIONED first (see
  # m1/README.md): alembic as the owner role, then rls.sql /
  # triggers.sql / roles.sql, and the runtime role provisioned with
  # POSTGRES_PASSWORD (local dev only — the password set in the
  # environment / .env, shared by the owner and runtime roles for
  # local dev; never a committed value). The app
  # connects as the RUNTIME role (B-4), never as the owner role.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: courierledger-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://courierledger_runtime:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-courierledger}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set (no placeholder default)}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set (no placeholder default)}
      FRONTEND_URL: ${FRONTEND_URL:-http://127.0.0.1:5173}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CREATE_TABLES_ON_STARTUP: "false"
    ports:
      # Phase 2 (Part 5): loopback-only, like the db port. This is a
      # local-dev stack; nothing here should listen on all interfaces.
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  # Optional: frontend. backend/Dockerfile exists and the frontend
  # Dockerfile (frontend/Dockerfile) builds the production bundle,
  # but this service stays commented out: `vite preview` does not
  # apply the dev-server /api proxy, so the containerised frontend
  # cannot reach the backend yet. Use `npm run dev` (Vite dev
  # server) for local work.
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: courierledger-frontend
  #   ports:
  #     - "5173:5173"
  #   depends_on:
  #     - backend

volumes:
  courierledger_pgdata:
