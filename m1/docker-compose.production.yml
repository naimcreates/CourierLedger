# CourierLedger M1 — PRODUCTION compose file (Phase 3, Stream C).
#
# VERIFICATION STATUS: UNVERIFIED — NO DOCKER TO RUN.
# `docker` is absent from this VM (removed by a container replacement;
# before that, 29.1.3 with containers unable to start: `runc create
# failed: setns`). `docker compose up` has NEVER run here, for this
# file or for the dev compose file. This file is YAML-shaped and
# reviewed, not executed. Do NOT claim it works until the commands in
# PRODUCTION_CONFIGURATION_GUIDE.md §11 run green on a
# container-capable host. B-2 stays open until then.
#
# HOW TO USE (on a container-capable host, after the host is chosen):
#   1. Copy .env.production.example to .env.production and fill every
#      value from the production secret store. Never commit it.
#   2. Provision the database ONCE (roles + RLS + triggers, then
#      migrations) — see PRODUCTION_CONFIGURATION_GUIDE.md §11 and
#      m1/README.md provisioning order. The `migrate` service below
#      only runs Alembic; it does not create roles or apply rls.sql /
#      triggers.sql / roles.sql.
#   3. docker compose -f docker-compose.production.yml --env-file .env.production run --rm migrate
#   4. docker compose -f docker-compose.production.yml --env-file .env.production up -d
#   5. Verify with the §11 checklist (readiness, role separation,
#      persistence across restart, restore drill).
#
# WHAT THIS FILE IS (and is not):
# - A STANDALONE file: run it with `-f docker-compose.production.yml`
#   alone, NOT as an override of docker-compose.yml (dev). The dev
#   file binds ports to loopback and defaults to development; this
#   file is the production shape.
# - No frontend service. The containerised frontend (vite preview)
#   still cannot proxy /api to the backend (see frontend/Dockerfile),
#   so the frontend must be served by a static host or by the reverse
#   proxy in front of this stack — that choice needs a founder
#   decision (which host / which proxy). Do not wire a half-working
#   frontend service here.
# - A reverse proxy that terminates TLS is REQUIRED in front of the
#   backend (the app sets Secure cookies and HSTS only when it is
#   served behind HTTPS). The proxy is not defined here — no host or
#   proxy product has been chosen. TRUSTED_PROXY_IPS below must be
#   the proxy's address(es) on the compose network; uvicorn trusts
#   X-Forwarded-For / X-Forwarded-Proto ONLY from those IPs.
# - The database port is NOT published: only the backend reaches it,
#   over the compose network. Admin access is via `docker compose
#   exec db psql ...` from the host, or a jump host — never a
#   published port.
# - Migrations NEVER run on app startup (CREATE_TABLES_ON_STARTUP is
#   false and the app contains no Alembic call). Schema changes run
#   only through the one-shot `migrate` service, as the owner role.

services:
  db:
    image: postgres:16
    container_name: courierledger-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (no placeholder default)}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
    # No `ports:` entry on purpose — the database is reachable only
    # from the compose network. Do not add one without a founder
    # decision and a firewall rule.
    volumes:
      - courierledger_pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot migration runner (owner role). Run explicitly before
  # (re)starting the backend; never on a schedule, never as part of
  # backend startup. Exits non-zero on any migration failure — see
  # INCIDENT_RESPONSE_RUNBOOK.md §4.
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: courierledger-migrate-prod
    environment:
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?MIGRATION_DATABASE_URL must be set (owner role)}
    depends_on:
      db:
        condition: service_healthy
    # `profiles` keeps `up` from starting this as a long-running
    # service; it only runs via `run --rm migrate`.
    profiles: ["migrate"]
    command: ["alembic", "upgrade", "head"]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: courierledger-backend-prod
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set (runtime role)}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set (no placeholder default)}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set (no placeholder default)}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL must be set (single CORS origin, https://...)}
      ENVIRONMENT: production
      SESSION_COOKIE_SECURE: "true"
      CREATE_TABLES_ON_STARTUP: "false"
    ports:
      # Loopback only: the TLS-terminating reverse proxy on the host
      # (or on the compose network) forwards to this port. Nothing
      # here listens on a public interface.
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # --proxy-headers + --forwarded-allow-ips: uvicorn honours
    # X-Forwarded-For / X-Forwarded-Proto ONLY from TRUSTED_PROXY_IPS
    # (the reverse proxy's address(es)). Without this, the rate
    # limiter sees the proxy's IP for every client and the app never
    # learns the real client IP or scheme. TRUSTED_PROXY_IPS is
    # required — the container refuses to start without it.
    command:
      - "uvicorn"
      - "app.main:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--proxy-headers"
      - "--forwarded-allow-ips"
      - "${TRUSTED_PROXY_IPS:?TRUSTED_PROXY_IPS must be set to the reverse proxy address(es)}"
    healthcheck:
      # Readiness probe: /api/ready is 200 only when the database
      # round-trip succeeds (Phase 2). /api/health would report a
      # database-less container as healthy.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=4)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  courierledger_pgdata_prod:
