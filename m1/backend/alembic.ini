# Alembic Config -- CourierLedger M1
# Single initial migration (0001_initial_m1) creates all M1 tables.
# The URL is taken from the DATABASE_URL environment variable first
# (see alembic/env.py); the value below is only a local placeholder and
# is never used when DATABASE_URL is set.

[alembic]
script_location = alembic
prepend_sys_path = .
sourceless = false
sqlalchemy.url = postgresql+psycopg://courierledger:change-me@localhost:5432/courierledger

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
